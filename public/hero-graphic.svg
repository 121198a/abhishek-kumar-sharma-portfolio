<svg viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract network graphic representing full-stack systems">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#0f0820" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f0820" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15" />
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <!-- ambient glow -->
  <circle cx="260" cy="235" r="230" fill="url(#coreGlow)" filter="url(#softBlur)" />

  <!-- connecting lines: full-stack layers wired together -->
  <g stroke="url(#lineGrad)" stroke-width="1.4" fill="none">
    <line x1="260" y1="150" x2="130" y2="230" />
    <line x1="260" y1="150" x2="260" y2="270" />
    <line x1="260" y1="150" x2="390" y2="220" />
    <line x1="130" y1="230" x2="150" y2="360" />
    <line x1="130" y1="230" x2="260" y2="270" />
    <line x1="260" y1="270" x2="390" y2="220" />
    <line x1="260" y1="270" x2="290" y2="400" />
    <line x1="390" y1="220" x2="370" y2="350" />
    <line x1="150" y1="360" x2="290" y2="400" />
    <line x1="290" y1="400" x2="370" y2="350" />
  </g>

  <!-- nodes: layers of a full-stack system (client / api / logic / data) -->
  <g>
    <circle cx="260" cy="150" r="10" fill="#f7f4ff" />
    <circle cx="130" cy="230" r="8" fill="#c084fc" />
    <circle cx="390" cy="220" r="8" fill="#c084fc" />
    <circle cx="260" cy="270" r="12" fill="#ec4899" />
    <circle cx="150" cy="360" r="7" fill="#a855f7" opacity="0.85" />
    <circle cx="370" cy="350" r="7" fill="#a855f7" opacity="0.85" />
    <circle cx="290" cy="400" r="9" fill="#7c3aed" />
  </g>

  <!-- orbit rings, echoing the original orb motif -->
  <g fill="none" stroke="#c084fc" stroke-opacity="0.28">
    <ellipse cx="260" cy="245" rx="210" ry="150" transform="rotate(18 260 245)" />
    <ellipse cx="260" cy="245" rx="170" ry="120" transform="rotate(-32 260 245)" />
  </g>
</svg>
