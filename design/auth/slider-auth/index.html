<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up | Runway Page</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="card" id="authCard">
    <div class="card-bg"></div>

    <!-- Register Hero (visible when card has 'register' class, prompts to Sign In) -->
    <div class="hero register">
      <h2>Welcome Back!</h2>
      <p>To keep connected with us please sign in with your personal info</p>
      <button type="button" class="switch" id="switchToLogin">Sign In</button>
    </div>

    <!-- Register Form (visible on the right when card has 'register' class) -->
    <form class="form register" id="registerForm" onsubmit="event.preventDefault()">
      <h2 class="form-title">Create Account</h2>
      <p class="form-subtitle">Join us to start your journey</p>

      <div class="input-group">
        <label for="reg-name">Full Name</label>
        <input id="reg-name" type="text" placeholder="enter your name" required autocomplete="name">
      </div>

      <div class="input-group">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="input-group">
        <label for="reg-pass">Password</label>
        <input id="reg-pass" type="password" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn-submit">Sign Up</button>
    </form>

    <!-- Login Hero (visible in default login state, prompts to Sign Up) -->
    <div class="hero login">
      <h2>Hello, Friend!</h2>
      <p>Enter your personal details and start your journey with us</p>
      <button type="button" class="switch" id="switchToRegister">Sign Up</button>
    </div>

    <!-- Login Form (visible on the left in default login state) -->
    <form class="form login" id="loginForm" onsubmit="event.preventDefault()">
      <h2 class="form-title">Sign In</h2>
      <p class="form-subtitle">Welcome back! Please enter your details.</p>

      <div class="input-group">
        <label for="log-email">Email</label>
        <input id="log-email" type="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="input-group">
        <label for="log-pass">Password</label>
        <input id="log-pass" type="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div class="form-options">
        <label>
          <input type="checkbox"> Remember me
        </label>
        <a href="#forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>
  </div>

  <script>
    const card = document.getElementById('authCard');
    const switchToRegister = document.getElementById('switchToRegister');
    const switchToLogin = document.getElementById('switchToLogin');

    switchToRegister.addEventListener('click', () => {
      card.classList.add('register');
    });

    switchToLogin.addEventListener('click', () => {
      card.classList.remove('register');
    });
  </script>
</body>
</html>
