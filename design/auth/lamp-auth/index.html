<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in | LuminaVault</title>
    <meta name="description" content="Log in or sign up to LuminaVault. A responsive split-screen sign-in page with a dimmable chandelier, live password-strength feedback, and dark and light themes." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Log in or sign up | LuminaVault" />
    <meta property="og:description" content="A responsive split-screen sign-in page with a dimmable chandelier, live password-strength feedback, and dark and light themes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('lv-theme');
          var dark = saved ? saved === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
